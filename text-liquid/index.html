<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Text</title>
<style>
  :root{
    --radius:12px; --radius-sm:8px;
    --border-color:rgba(255,255,255,.14);
    --text-primary:#eef1fb; --text-secondary:#98a3c0; --text-muted:#8b93ad;
    --bg:#07070d; --panel-bg:rgba(14,16,28,.82);
    --bg-card:rgba(20,22,38,.72); --bg-secondary:rgba(255,255,255,.05);
    --accent-color:#7c5cff; --accent-purple:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
  body{display:flex;flex-direction:column;}
  input[type=range]{accent-color:#7dd3fc;}
  button{font:inherit;cursor:pointer;}
  .btn-primary,.btn-secondary{
    border-radius:8px;border:1px solid var(--border-color);padding:6px 12px;
    background:rgba(255,255,255,.06);color:var(--text-primary);}
  .btn-primary{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.4);}
  .btn-primary:hover,.btn-secondary:hover{background:rgba(255,255,255,.13);}

  .ve-container { position: relative; width: 100%; height: 600px; }
  .ve-container.is-fs { width: 100vw; height: 100vh; }
  canvas { width: 100%; height: 100%; display: block; }
  .controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 10; align-items: center; }
  .controls input { padding: 6px 12px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #555; border-radius: 4px; width: 140px; }
  button { padding: 6px 12px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
</style>
<style>ve-container{height:100vh!important;width:100vw!important;border-radius:0!important;}ve-container canvas{width:100%!important;height:100%!important;display:block;}</style>
</head>
<body>
<div class="ve-container">
  <canvas id="canvas"></canvas>
  <div class="controls">
    <input type="text" id="text-input" value="LIQUID" placeholder=Enter text />
    <button id="fullscreen-btn">Fullscreen</button>
    <button id="reset-btn">Reset</button>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let animId;
  let particles = [];
  let textPixels = [];
  let time = 0;
  let text = 'LIQUID';

  class Particle {
    constructor(x, y, targetX, targetY) {
      this.x = x; this.y = y;
      this.targetX = targetX; this.targetY = targetY;
      this.vx = 0; this.vy = 0;
      this.radius = Math.random() * 2 + 1;
      this.color = `hsl(${Math.random() * 40 + 200}, 70%, 60%)`;
    }
    update() {
      const dx = this.targetX - this.x;
      const dy = this.targetY - this.y;
      this.vx += dx * 0.02; this.vy += dy * 0.02;
      this.vx *= 0.95; this.vy *= 0.95;
      this.x += this.vx; this.y += this.vy;
    }
    draw(ctx) {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function getTextPixels() {
    const fontSize = Math.min(canvas.width / (text.length * 0.7), 160);
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = [];
    const gap = 4;
    for (let y = 0; y < canvas.height; y += gap) {
      for (let x = 0; x < canvas.width; x += gap) {
        const index = (y * canvas.width + x) * 4;
        if (imageData.data[index + 3] > 128) pixels.push({ x, y });
      }
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return pixels;
  }

  function init() {
    textPixels = getTextPixels();
    particles = [];
    textPixels.forEach(pixel => {
      const startX = Math.random() * canvas.width;
      const startY = Math.random() * canvas.height;
      particles.push(new Particle(startX, startY, pixel.x, pixel.y));
    });
  }

  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    init();
  }

  function animate() {
    ctx.fillStyle = 'rgba(10, 15, 30, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    time += 0.01;
    particles.forEach(particle => {
      const wobbleX = Math.sin(time * 2 + particle.targetX * 0.01) * 3;
      const wobbleY = Math.cos(time * 2 + particle.targetY * 0.01) * 3;
      particle.targetX += wobbleX * 0.01;
      particle.targetY += wobbleY * 0.01;
      particle.update();
      particle.draw(ctx);
    });
    animId = requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  resize();
  animate();

  document.getElementById('text-input').addEventListener('input', function() {
    text = this.value || 'LIQUID';
    init();
  });

  document.getElementById('reset-btn').onclick = () => {
    cancelAnimationFrame(animId);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    resize();
    animate();
  };

  document.getElementById('fullscreen-btn').onclick = () => {
    const container = canvas.parentElement;
    if (!document.fullscreenElement) container.requestFullscreen();
    else document.exitFullscreen();
  };

  document.addEventListener('fullscreenchange', () => {
    setTimeout(resize, 150);
  });
</script>
<script>(function(){var r=document.querySelector('.ve-container');if(r)r.classList.add('is-fs');})();</script>
</body>
</html>
